function getRankBonus(unit) {
  let def = 0, acc = 0, pow = 0, dodge = 0, apCost = 0, regen = 0;
  if (unit.ranks.knight >= 1) def += 1;
  if (unit.ranks.knight >= 2) def += 1;
  if (unit.ranks.archer >= 1) acc += 1;
  if (unit.ranks.archer >= 2) acc += 1;
  if (unit.ranks.alchemist >= 1) pow += 1;
  if (unit.ranks.alchemist >= 2) pow += 1;
  const mastered = Object.entries(unit.ranks).filter(([, v]) => v >= 2).map(([k]) => k);
  // Bei König (alle 3 gemeistert) nur den Bonus des ersten Sonderrangs vergeben.
  // Der erste Sonderrang ist derjenige, der NICHT den masterCareer enthält,
  // da die beiden gelernten Karrieren den ersten Sonderrang ergeben.
  // Einfacher: Der Sonderrang-Bonus richtet sich nach masterCareer:
  // masterCareer knight → war General (k+a) → dodge
  // masterCareer archer → war Stratege (a+al) → apCost
  // masterCareer alchemist → war Paladin (k+al) → regen
  if (mastered.length >= 3) {
    if (unit.masterCareer === "knight") dodge = 2;
    else if (unit.masterCareer === "archer") apCost = -2;
    else if (unit.masterCareer === "alchemist") regen = 2;
  } else {
    if (mastered.includes("knight") && mastered.includes("archer")) dodge = 2;
    if (mastered.includes("knight") && mastered.includes("alchemist")) regen = 2;
    if (mastered.includes("archer") && mastered.includes("alchemist")) apCost = -2;
  }
  return { def, acc, pow, dodge, apCost, regen };
}

function getSpecialRank(unit) {
  const mastered = Object.entries(unit.ranks).filter(([, v]) => v >= 2).map(([k]) => k);
  if (mastered.length >= 3) return "König";
  if (mastered.includes("knight") && mastered.includes("archer")) return "General";
  if (mastered.includes("knight") && mastered.includes("alchemist")) return "Paladin";
  if (mastered.includes("archer") && mastered.includes("alchemist")) return "Stratege";
  return null;
}

// Gibt zurück ob eine Einheit durch ein rankUp in 'career' erstmals einen Sonderrang erhält.
// Liefert { fromName, toName } oder null.
function detectNewSonderrang(unit, career) {
  const before = getSpecialRank(unit);
  // Simuliere den neuen Zustand nach Meister-Rang in 'career'
  const fakeUnit = { ...unit, ranks: { ...unit.ranks, [career]: 2 } };
  const after = getSpecialRank(fakeUnit);
  if (!before && after && after !== "König") {
    // fromName: bisheriger Einheitsname
    const prevSr = getSpecialRank(unit);
    const fromName = prevSr || CAREER_LABEL[unit.masterCareer];
    return { fromName, toName: after };
  }
  return null;
}

function createUnit(id, player, masterCareer, x, y) {
  const ranks = { knight: 0, archer: 0, alchemist: 0 };
  ranks[masterCareer] = 2;
  return {
    id, player, masterCareer, x, y, hp: 6, bounty: 1,
    status: STATUS.READY,
    exp: { knight: 0, archer: 0, alchemist: 0 },
    ranks,
    trainingLevel: {
      knight: masterCareer === CAREER.KNIGHT ? 3 : 0,
      archer: masterCareer === CAREER.ARCHER ? 3 : 0,
      alchemist: masterCareer === CAREER.ALCHEMIST ? 3 : 0,
    },
    ko: false,
    warcryUsed: false,
    usedActions: [],
  };
}

function initialUnits() {
  const careers = [CAREER.KNIGHT, CAREER.ARCHER, CAREER.ALCHEMIST];
  const occupied = new Set();
  const units = [];
  for (let p = 0; p < 2; p++) {
    for (let i = 0; i < 3; i++) {
      let x, y;
      do {
        x = Math.floor(Math.random() * BOARD_SIZE);
        y = Math.floor(Math.random() * BOARD_SIZE);
      } while (occupied.has(`${x},${y}`));
      occupied.add(`${x},${y}`);
      units.push(createUnit(p * 3 + i + 1, p, careers[i], x, y));
    }
  }
  return units;
}

function randomFreeCell(units, camps) {
  const occupied = new Set([
    ...units.filter(u => !u.ko).map(u => `${u.x},${u.y}`),
    ...camps.map(c => `${c.x},${c.y}`)
  ]);
  let x, y, t = 0;
  do { x = Math.floor(Math.random() * BOARD_SIZE); y = Math.floor(Math.random() * BOARD_SIZE); t++; }
  while (occupied.has(`${x},${y}`) && t < 100);
  return { x, y };
}

function initialCamps(units) {
  const careers = [CAREER.KNIGHT, CAREER.ARCHER, CAREER.ALCHEMIST];
  const camps = [];
  for (let p = 0; p < 2; p++)
    for (const c of careers) {
      const pos = randomFreeCell(units, camps);
      camps.push({ x: pos.x, y: pos.y, career: c, player: p });
    }
  return camps;
}

function manhattan(a, b) { return Math.abs(a.x - b.x) + Math.abs(a.y - b.y); }

function canUseAction(unit, action) {
  if (unit.status === STATUS.DONE || unit.status === STATUS.SEDATIVE || unit.status === STATUS.SHIELD) return false;
  return unit.trainingLevel[action.career] >= action.tier;
}

function getActionTargets(unit, action, units) {
  if (action.special === "warcry" && unit.warcryUsed) return [];
  return units.filter(t => {
    if (t.ko) return false;
    const dist = manhattan(unit, t);
    const inRange = action.range.includes(dist) || (action.range.includes(0) && t.id === unit.id);
    if (!inRange) return false;
    if (action.heal) return t.player === unit.player && t.hp < 6;
    if (action.special === "warcry") return t.player === unit.player && t.status !== STATUS.WARCRY;
    if (action.special === "serum") return t.player === unit.player;
    if (action.special === "sedative" || action.atk) return t.player !== unit.player;
    return t.player === unit.player;
  });
}

function CareerSprite({ career, size = 32, dim = false, unit = null, previousSpecialRank = null }) {
  if (unit) {

    if (sr === "König") {
      const rankToShow = previousSpecialRank;
      if (rankToShow === "Paladin") return <PixelPaladin size={size} dim={dim} />;
      if (rankToShow === "General") return <PixelGeneral size={size} dim={dim} />;

    if (sr === "Stratege") return <PixelStratege size={size} dim={dim} />;
  }
  if (career === "knight") return <PixelKnight size={size} dim={dim} />;
  if (career === "archer") return <PixelArcher size={size} dim={dim} />;
  return <PixelAlchemist size={size} dim={dim} />;

function DicePips({ value, size = 36, color = "#1a0f07" }) {
  // Standard-Würfel-Pip-Positionen im 3×3-Raster (col, row), 0-indexed
  const PATTERNS = {
    1: [[1,1]],
    2: [[0,0],[2,2]],
    3: [[0,0],[1,1],[2,2]],
    4: [[0,0],[2,0],[0,2],[2,2]],
    5: [[0,0],[2,0],[1,1],[0,2],[2,2]],
    6: [[0,0],[2,0],[0,1],[2,1],[0,2],[2,2]],
  };
  const pips = PATTERNS[value] || [];
  const pipSize = size * 0.18;
  const cellSize = size / 4;
  const offset = (size - 3 * cellSize) / 2;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {pips.map(([cx, cy], i) => (
        <circle key={i}
          cx={offset + cx * cellSize + cellSize / 2}
          cy={offset + cy * cellSize + cellSize / 2}
          r={pipSize / 2}
          fill={color}
        />
      ))}
    </svg>
  );
}

// ─── Camp Tower Component ─────────────────────────────────────────────────────
// Zentrale Spalte mit Kästchen 0..8. Links und rechts je ein Spielerbereich
// (mit Spielerfarbe), je zweispaltig: innere Spalte mit Medaillen-Icon (steigt
// mit der Anzahl gesammelter Medaillen), äußere Spalte mit Geschenken auf den
// Höhen 2/4/6/8, die nach Wahl in ❤ oder ⚡ verwandelt werden.
const CAMP_THRESHOLDS = [2, 4, 6, 8];
const CAMP_MAX = 8;

function CampTower({ crownPositions, decisions, playerColors, campFlash, markerFlashPlayers, desktopLayout }) {
  const scale = desktopLayout ? 1.5 : 1;
  const ROW_H = Math.round(26 * scale);
  const ROWS = 9; // 0..8
  const TOWER_W = Math.round(52 * scale);
  const SIDE_COL_W = Math.round(14 * scale);       // Breite der Geschenk-Boxen in der Mittelspalte
  const MEDAL_SIZE = Math.round(16 * scale);       // deutlich größere Medaille mit S1/S2-Label
  const MEDAL_COL_W = MEDAL_SIZE + Math.round(10 * scale); // Medaillen-Spalte: Medaille + Abstand zur Mittelspalte
  const totalH = ROW_H * ROWS;
  const playerAreaW = MEDAL_COL_W;

  // Mapping Höhe -> Y-Position (oben = 8, unten = 0)
  const rowTop = (n) => (CAMP_MAX - n) * ROW_H;

  const renderPlayerArea = (player, side) => {
    const crownPos = crownPositions[player];
    const isMarkerFlashing = (markerFlashPlayers || []).includes(player);
    // Spieler 1 (links) → Medaille linksbündig (weg vom Tower)
    // Spieler 2 (rechts) → Medaille rechtsbündig (weg vom Tower)
    const medalJustify = side === "left" ? "flex-start" : "flex-end";
    return (
      <div style={{
        position: "relative",
        width: playerAreaW,
        height: "100%",
        boxSizing: "border-box",
        flex: "0 0 auto",
      }}>
        {/* Medaillen-Icon: steigt mit der Anzahl gesammelter Medaillen (1s-Transition).
            Highlight: die Medaille selbst blinkt im Takt der anderen Highlights —
            wechselt zwischen normaler Darstellung und hell leuchtend (kein Rahmen). */}
        <div style={{
          position: "absolute",
          left: 0,
          top: rowTop(crownPos),
          width: MEDAL_COL_W,
          height: ROW_H,
          display: "flex", alignItems: "center", justifyContent: medalJustify,
          transition: "top 1s ease-in-out",
          filter: isMarkerFlashing
            ? "brightness(1.6) drop-shadow(0 0 4px #ffd700) drop-shadow(0 0 8px #ffd700)"
            : "none",
          boxSizing: "border-box",
        }}>
          <span style={{ fontSize: MEDAL_SIZE, lineHeight: 1, textShadow: "0 0 3px rgba(255,255,255,0.9), 0 0 6px rgba(255,255,255,0.6)" }}>{player === 0 ? "🏯" : "🏰"}</span>
        </div>
      </div>
    );
  };

  // Symbol je Spieler für eine bestimmte Schwelle (🎁 oder ❤ oder ⚡)
  const renderGiftSymbol = (player, decisionIdx) => {
    const decided = decisions[player][decisionIdx];
    if (!decided) return <span style={{ fontSize: Math.round(10 * scale) }}>🎁</span>;
    if (decided === "heart") return <span style={{ fontSize: Math.round(11 * scale), color: "#e74c3c" }}>❤</span>;
    return <span style={{ fontSize: Math.round(11 * scale) }}>⚡</span>;
  };

  // Prüfen, ob für eine bestimmte Spieler+Schwelle-Kombination gerade ein Flash läuft
  const isGiftFlashing = (player, decisionIdx) => {
    return (campFlash || []).some(f => f.player === player && f.decisionIdx === decisionIdx);
  };

  // Gemeinsamer Wrapper mit fester Höhe, alle drei Spalten füllen 100% Höhe → bündig.
  return (
    <div style={{ display: "flex", justifyContent: "center", alignItems: "stretch", height: totalH, gap: 0 }}>
      {/* Spieler 1 links: nur Medaillen-Spalte */}
      {renderPlayerArea(0, "left")}

      {/* Mittlere Spalte: Kästchen 0..8, auf 2/4/6/8 mit 🎁 links/rechts */}
      <div style={{
        width: TOWER_W,
        height: "100%",
        display: "flex",
        flexDirection: "column",
        flex: "0 0 auto",
        border: "1px solid rgba(255,255,255,0.18)",
        background: "#160e05",
        boxSizing: "border-box",
      }}>
        {Array.from({ length: ROWS }, (_, i) => {
          const value = CAMP_MAX - i; // oben = 8, unten = 0
          const maxReached = Math.max(crownPositions[0], crownPositions[1]);
          const isReached = maxReached >= value;
          const thresholdIdx = CAMP_THRESHOLDS.indexOf(value);
          const isThreshold = thresholdIdx !== -1;
          return (
            <div key={value} style={{
              flex: 1,
              borderBottom: i < ROWS - 1 ? "1px solid rgba(255,255,255,0.18)" : "none",
              background: isReached ? "rgba(212,168,83,0.10)" : "rgba(255,255,255,0.03)",
              display: "flex", alignItems: "center", justifyContent: "center",
              fontSize: Math.round(10 * scale), color: isReached ? "#ffe080" : "#a07040",
              fontWeight: "bold",
              boxSizing: "border-box",
              position: "relative",
            }}>
              {isThreshold ? (
                <>
                  {/* Geschenk Spieler 1 (links, näher zur Zahl) */}
                  <div style={{
                    position: "absolute",
                    left: 4, top: 0,
                    width: SIDE_COL_W, height: "100%",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    borderRadius: 3,
                    outline: isGiftFlashing(0, thresholdIdx) ? "2px solid #ffd700" : "none",
                    outlineOffset: isGiftFlashing(0, thresholdIdx) ? "-1px" : 0,
                    boxShadow: isGiftFlashing(0, thresholdIdx) ? "0 0 6px #ffd700" : "none",
                    boxSizing: "border-box",
                  }}>
                    {renderGiftSymbol(0, thresholdIdx)}
                  </div>
                  {/* Zahl in der Mitte */}
                  <span>{value}</span>
                  {/* Geschenk Spieler 2 (rechts, näher zur Zahl) */}
                  <div style={{
                    position: "absolute",
                    right: 4, top: 0,
                    width: SIDE_COL_W, height: "100%",
                    display: "flex", alignItems: "center", justifyContent: "center",
                    borderRadius: 3,
                    outline: isGiftFlashing(1, thresholdIdx) ? "2px solid #ffd700" : "none",
                    outlineOffset: isGiftFlashing(1, thresholdIdx) ? "-1px" : 0,
                    boxShadow: isGiftFlashing(1, thresholdIdx) ? "0 0 6px #ffd700" : "none",
                    boxSizing: "border-box",
                  }}>
                    {renderGiftSymbol(1, thresholdIdx)}
                  </div>
                </>
              ) : value === 0 ? (
                <MedalIcon earned={isReached} size={Math.round(10 * scale)} />
              ) : (
                <span>{value}</span>
              )}
            </div>
          );
        })}
      </div>

      {/* Spieler 2 rechts: nur Medaillen-Spalte */}
      {renderPlayerArea(1, "right")}
    </div>
  );
}

// ─── Medal Icon ────────────────────────────────────────────────────────────────
function MedalIcon({ earned = false, size = 10, career = null, label = null, labelColor = "#000" }) {
  const palettes = {
    knight:   { center: "#4a90d9", centerShine: "rgba(255,255,255,0.35)" },
    archer:   { center: "#5cb85c", centerShine: "rgba(255,255,255,0.35)" },
    alchemist:{ center: "#e8832a", centerShine: "rgba(255,255,255,0.35)" },
    gold:     { center: "#ffd700", centerShine: "rgba(255,255,255,0.35)" },
  };
  const pal = palettes[career] || palettes.gold;
  const gold = earned ? "#d4a853" : "rgba(255,255,255,0.18)";
  const goldLight = earned ? "#ffe080" : "rgba(255,255,255,0.08)";
  const center = earned ? pal.center : "rgba(255,255,255,0.12)";
  const centerShine = earned ? pal.centerShine : "rgba(255,255,255,0.05)";
  const s = size;
  const h = Math.round(size * 1.35);
  const gear = Array.from({ length: 24 }, (_, i) => {
    const angle = (i * Math.PI * 2) / 24 - Math.PI / 2;
    const r = i % 2 === 0 ? s * 0.47 : s * 0.41;
    return `${s/2 + Math.cos(angle)*r},${s/2 + Math.sin(angle)*r}`;
  }).join(" ");
  return (
    <svg width={s} height={h} viewBox={`0 0 ${s} ${h}`} style={{ display: "block" }}>
      <polygon points={`${s*0.30},${s*0.82} ${s*0.45},${s*0.72} ${s*0.38},${h*0.98} ${s*0.22},${h}`} fill={gold} />
      <polygon points={`${s*0.70},${s*0.82} ${s*0.55},${s*0.72} ${s*0.62},${h*0.98} ${s*0.78},${h}`} fill={gold} />
      <line x1={s*0.32} y1={s*0.84} x2={s*0.26} y2={h*0.97} stroke={goldLight} strokeWidth={s*0.04} />
      <line x1={s*0.68} y1={s*0.84} x2={s*0.74} y2={h*0.97} stroke={goldLight} strokeWidth={s*0.04} />
      <polygon points={gear} fill={gold} />
      <circle cx={s/2} cy={s/2} r={s*0.36} fill={gold} />
      <circle cx={s/2} cy={s/2} r={s*0.33} fill="none" stroke={goldLight} strokeWidth={s*0.03} />
      <circle cx={s/2} cy={s/2} r={s*0.27} fill={center} />
      <ellipse cx={s*0.42} cy={s*0.38} rx={s*0.09} ry={s*0.06} fill={centerShine} />
      {label && (
        <text
          x={s/2}
          y={s/2}
          textAnchor="middle"
          dominantBaseline="central"
          fontFamily="'Georgia', serif"
          fontWeight="bold"
          fontSize={s*0.36}
          fill={labelColor}
          stroke="#000"
          strokeWidth={s*0.05}
          paintOrder="stroke"
          style={{ pointerEvents: "none" }}
        >{label}</text>
      )}
    </svg>
  );
}

    </div>

  const learnCareers = [CAREER.KNIGHT, CAREER.ARCHER, CAREER.ALCHEMIST].filter(c => c !== unit.masterCareer);
  const bonus = getRankBonus(unit);
  const specialRank = getSpecialRank(unit);

        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 4, flexWrap: "wrap" }}>

              // Zustand 3: König — Name und Krone aus winnerUnit
